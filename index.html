<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heat Death Holdings</title>
<meta name="description" content="An idle energy tycoon in pixel art. Climb the Kardashev scale from a hamster wheel to zero-point energy, then collapse the universe for dark matter.">
<meta property="og:title" content="Heat Death Holdings">
<meta property="og:description" content="An idle energy tycoon in pixel art. Climb the Kardashev scale from a hamster wheel to zero-point energy, then collapse the universe for dark matter.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: a 16-bit arcade cabinet. Mascot + speech bubble on top, a scoreboard HUD pinned under it, ten fixed-size pixel-art source cards, and a side column (upgrades scroll box, Big Crunch, network). Stats and Settings open as windows on top. Every live element has a fixed size so nothing moves under the cursor.
   Deliberately a single dark "night sky" look; palette is a classic 16-color fantasy-console set. */
:root {
  --space: #0b1026;
  --panel: #1d2b53;
  --panel-2: #141d3c;
  --edge: #83769c;
  --ink: #fff1e8;
  --muted: #c2c3c7;
  --dim: #83769c;
  --yellow: #ffec27;
  --orange: #ffa300;
  --brown: #ab5236;
  --red: #ff004d;
  --pink: #ff77a8;
  --blue: #29adff;
  --green: #00e436;
  --plum: #7e2553;
  --peach: #ffccaa;
  --font-title: "Press Start 2P", "Courier New", monospace;
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  --font-term: "VT323", "Courier New", monospace;
  --font-num: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
html { background: var(--space); }
body { background: var(--space); color: var(--ink); font-family: var(--font-term); font-size: 19px; line-height: 1.15; padding-inline: 16px; padding-block: 14px 48px; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
h1, h2, h3 { margin: 0; font-weight: normal; }
p { margin: 0; }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; image-rendering: pixelated; }
.lbl { font-family: var(--font-term); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.off { opacity: 0.45; cursor: not-allowed; }
/* pixel "rounded" outline: four offset shadows draw a notched-corner border outside the box */
.box { background: var(--panel); box-shadow: 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }

.app { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "hud" "buyrow" "sources" "side"; }
.buyrow { grid-area: buyrow; display: none; justify-content: space-between; align-items: center; gap: 10px; }
.row-ib { display: flex; gap: 6px; }
.title { grid-area: title; } .hud { grid-area: hud; } .sources { grid-area: sources; } .side { grid-area: side; }
@media (min-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); grid-template-areas: "title title" "hud hud" "sources side"; align-items: start; }
}

/* ---- Title, mascot, speech bubble (fixed height) ---- */
.title { display: grid; grid-template-columns: 72px auto minmax(0, 1fr); gap: 0 18px; align-items: center; height: 84px; }
#mascot { width: 72px; height: 72px; }
h1 { font-family: var(--font-title); font-size: 20px; line-height: 1.3; color: var(--yellow); text-shadow: 3px 3px 0 var(--brown); white-space: nowrap; }
.pitch { color: var(--muted); font-size: 19px; margin-top: 4px; white-space: nowrap; }
.bubble { position: relative; height: 66px; padding: 7px 12px; display: grid; align-content: start; gap: 1px; margin-left: 10px; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -12px; top: 22px; width: 9px; height: 12px; background: var(--edge); clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.bubble b { font-family: var(--font-pixel); font-weight: 600; font-size: 13px; color: var(--pink); letter-spacing: 0.04em; text-transform: uppercase; }
#bubble { font-size: 19px; line-height: 1.05; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
@media (max-width: 859px) {
  .title { grid-template-columns: 48px minmax(0, 1fr); grid-template-areas: "m h" "m b"; height: auto; gap: 8px 12px; align-items: start; }
  #mascot { grid-area: m; width: 48px; height: 48px; margin-top: 4px; }
  .tt { grid-area: h; } .bubble { grid-area: b; margin-left: 6px; height: 74px; }
  .bubble::before { top: 10px; }
  #bubble { -webkit-line-clamp: 3; }
  h1 { font-size: 13px; }
  .pitch { display: none; }
}

/* ---- HUD scoreboard ---- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(11, 16, 38, 0.94); padding-block: 8px 10px; border-bottom: 3px dashed var(--panel);
  display: grid; gap: 8px 20px; align-items: center; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "bank buy" "kard kard"; }
@media (min-width: 860px) { .hud { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.45fr) auto; grid-template-areas: "bank kard buy"; height: 112px; } }
.bank { grid-area: bank; min-width: 0; }
.bank b { display: block; font-family: var(--font-title); font-size: clamp(22px, 5.6vw, 32px); line-height: 1.1; margin-top: 4px; color: var(--yellow); text-shadow: 3px 3px 0 var(--brown); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 3px; }
.kard { grid-area: kard; min-width: 0; display: grid; gap: 3px; }
.kline { display: flex; gap: 4px 12px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.kline b { font-family: var(--font-num); font-size: 27px; font-variant-numeric: tabular-nums; color: var(--green); }
.kline b.k { color: var(--pink); }
.kbar { position: relative; height: 12px; margin-top: 26px; background: var(--panel-2); box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); }
.kbar i { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 6px, var(--panel-2) 6px 8px), linear-gradient(90deg, var(--blue), var(--green) 30%, var(--yellow) 55%, var(--orange) 75%, var(--pink)); clip-path: inset(0 100% 0 0); }
.kbar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--muted); }
.kbar .tick .ki { position: absolute; bottom: calc(100% + 1px); left: 50%; transform: translateX(-50%); width: 20px; height: 20px; }
.kbar .tick .kt { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); font-size: 15px; color: var(--muted); white-space: nowrap; }
.kbar .tick.end .ki { left: auto; right: -2px; transform: none; }
.cmp { font-size: 17px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp span:first-child { color: var(--ink); }
.buy { grid-area: buy; display: grid; gap: 6px; justify-items: end; }
.buy-top { display: flex; gap: 10px; align-items: center; }
.mini { font-family: var(--font-pixel); font-size: 12px; border: 0; background: var(--panel); color: var(--muted); padding: 3px 7px; width: 92px; box-shadow: inset -2px -2px 0 0 var(--panel-2); }
.mini.on { color: var(--green); }
.seg { display: inline-flex; gap: 3px; }
.seg button { border: 0; background: var(--panel); padding: 6px 8px; font-family: var(--font-pixel); font-size: 14px; box-shadow: inset -3px -3px 0 0 var(--panel-2); }
.seg button[aria-pressed="true"] { background: var(--orange); color: #241200; box-shadow: inset -3px -3px 0 0 var(--brown); }

/* ---- Source cards ---- */
.sources { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); min-width: 0; padding: 3px; }
@media (min-width: 1120px) { .sources { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.src { height: 124px; display: grid; grid-template-columns: 84px minmax(0, 1fr); grid-template-rows: 22px 30px 38px; gap: 6px 12px; padding: 11px 12px; position: relative; }
.run { grid-row: 1 / 4; width: 84px; height: 102px; border: 0; background: var(--panel-2); display: grid; justify-items: center; align-content: center; gap: 0; padding: 2px; position: relative; touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-shadow: inset 3px 3px 0 0 #0b1026; }
.run canvas { width: 72px; height: 72px; }
.run .n { font-family: var(--font-num); font-size: 23px; line-height: 1; font-variant-numeric: tabular-nums; }
.run .autotag { position: absolute; top: 3px; right: 3px; font-family: var(--font-pixel); font-size: 10px; font-weight: 700; background: var(--blue); color: #0b1026; padding: 1px 3px; }
.run.ready { box-shadow: inset 0 0 0 3px var(--yellow); animation: blink 0.9s steps(1) infinite; }
@keyframes blink { 50% { box-shadow: inset 0 0 0 3px var(--orange); } }
.run.ready:active canvas { transform: translateY(2px); }
.run.auto, .run.off { cursor: default; opacity: 1; }
.srow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-width: 0; }
.srow h3 { font-family: var(--font-pixel); font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .lbl { overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.srow .lbl.go { color: var(--yellow); }
.src.locked h3 { color: var(--dim); }
.pbar { position: relative; height: 30px; background: var(--panel-2); box-shadow: inset 3px 3px 0 0 #0b1026; overflow: hidden; }
.pbar i { position: absolute; inset: 3px; background: repeating-linear-gradient(90deg, var(--blue) 0 8px, transparent 8px 10px); clip-path: inset(0 100% 0 0); }
.pbar.fast i { clip-path: none; background: repeating-linear-gradient(90deg, var(--blue) 0 8px, #9fdcff 8px 10px, var(--blue) 10px 18px, transparent 18px 20px); background-size: 20px 100%; animation: flow 0.6s steps(10) infinite; }
@keyframes flow { to { background-position: 20px 0; } }
.pbar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; font-family: var(--font-num); font-size: 22px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pbar b { font-weight: 600; text-shadow: 2px 0 0 #0b1026, -2px 0 0 #0b1026, 0 2px 0 #0b1026, 0 -2px 0 #0b1026; }
.brow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; align-items: center; }
.bbtn { height: 36px; border: 0; background: var(--orange); color: #241200; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 10px 3px; font-family: var(--font-pixel); font-weight: 600; font-size: 15px; white-space: nowrap; min-width: 0; box-shadow: inset -3px -3px 0 0 var(--brown), inset 3px 3px 0 0 #ffd27a; }
.bbtn:not(.off):active { box-shadow: inset 3px 3px 0 0 var(--brown); padding-top: 3px; padding-bottom: 0; }
.bbtn span:last-child { overflow: hidden; text-overflow: ellipsis; font-family: var(--font-num); font-size: 21px; }
.bbtn.off { background: var(--panel-2); color: var(--dim); box-shadow: inset 3px 3px 0 0 #0b1026; opacity: 1; }
.ms { min-width: 0; display: grid; gap: 4px; }
.ms .lbl { overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.mbar { height: 6px; background: var(--panel-2); }
.mbar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--pink) 0 4px, transparent 4px 5px); }
.pop { position: absolute; z-index: 5; pointer-events: none; font-family: var(--font-num); font-size: 22px; color: var(--yellow); white-space: nowrap; text-shadow: 2px 0 0 #0b1026, -2px 0 0 #0b1026, 0 2px 0 #0b1026, 0 -2px 0 #0b1026; animation: rise 0.9s steps(9) forwards; }
@keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-36px); } }
.bit { position: absolute; z-index: 5; width: 6px; height: 6px; pointer-events: none; animation: burst 0.8s steps(8) forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* ---- Side column ---- */
.side { display: grid; gap: 18px; min-width: 0; padding: 3px; }
.panel { padding: 14px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.ph h2 { font-family: var(--font-title); font-size: 13px; color: var(--yellow); text-shadow: 2px 2px 0 var(--brown); }
.note { color: var(--muted); font-size: 18px; margin-bottom: 10px; }
.upbox { height: 340px; overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 8px; align-content: start; padding: 2px 4px 2px 2px; scrollbar-color: var(--edge) var(--panel-2); }
.up { text-align: left; border: 0; background: var(--panel-2); padding: 8px 10px; display: grid; gap: 2px; box-shadow: inset -3px -3px 0 0 #0b1026; }
.up:hover:not(.off) { box-shadow: inset 0 0 0 3px var(--yellow); }
.up-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.up strong { font-family: var(--font-pixel); font-weight: 600; font-size: 15px; }
.up-d { font-size: 17px; color: var(--muted); }
.cost { font-family: var(--font-num); font-size: 20px; white-space: nowrap; }
.up.can .cost { color: var(--green); }
.up.done { opacity: 0.35; }
.kind { font-family: var(--font-pixel); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 5px; background: var(--panel); color: var(--muted); }
.kind.op { background: var(--blue); color: #0b1026; }
.kind.glob { background: var(--pink); color: #0b1026; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-bottom: 12px; }
.kv > div { background: var(--panel-2); padding: 8px 10px; display: grid; min-width: 0; box-shadow: inset 3px 3px 0 0 #0b1026; }
.kv .lbl { overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.kv b { font-family: var(--font-num); font-size: 31px; line-height: 1; color: var(--pink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { width: 100%; height: 42px; border: 0; background: var(--orange); color: #241200; font-family: var(--font-pixel); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px 3px; box-shadow: inset -3px -3px 0 0 var(--brown), inset 3px 3px 0 0 #ffd27a; }
.btn:not(.off):active { box-shadow: inset 3px 3px 0 0 var(--brown); padding: 3px 10px 0; }
.btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: inset -3px -3px 0 0 #0b1026; }
.btn.danger { color: var(--red); }
.btn.off { background: var(--panel-2); color: var(--dim); box-shadow: inset 3px 3px 0 0 #0b1026; opacity: 1; }
.dm { display: grid; gap: 6px; margin-top: 14px; }
.dm h3 { font-family: var(--font-pixel); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.dmi { text-align: left; border: 0; background: var(--panel-2); padding: 7px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: center; box-shadow: inset -3px -3px 0 0 #0b1026; }
.dmi:hover:not(.off) { box-shadow: inset 0 0 0 3px var(--pink); }
.dmi strong { font-family: var(--font-pixel); font-weight: 600; font-size: 14px; }
.dmi .up-d { grid-column: 1; font-size: 16px; }
.dmi .cost { grid-row: 1 / 3; grid-column: 2; color: var(--pink); }
.dmi.done { background: var(--plum); opacity: 1; cursor: default; }
.dmi.done .cost { color: var(--ink); }
.netline { display: flex; justify-content: space-between; gap: 10px; font-size: 18px; padding-block: 4px; border-bottom: 2px dotted var(--panel-2); }
.netline span:last-child { font-family: var(--font-num); font-size: 20px; white-space: nowrap; }
.netline span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ---- Endgame: heat death panel, multiverse window, ending ---- */
.kv b.q { color: var(--blue); }
.hlines { margin-top: 10px; }
.btn.cold { background: var(--blue); color: #0b1026; box-shadow: inset -3px -3px 0 0 var(--panel), inset 3px 3px 0 0 #9fdcff; }
.btn.cold.off { background: var(--panel-2); color: var(--dim); box-shadow: inset 3px 3px 0 0 #0b1026; }
.btn.gap { margin-top: 8px; }
.mlist { display: grid; gap: 6px; }
.dmi.law:hover:not(.off) { box-shadow: inset 0 0 0 3px var(--blue); }
.dmi.law .cost { color: var(--blue); }
.dmi.law .lv { font-family: var(--font-num); font-size: 18px; color: var(--blue); margin-left: 6px; }
.dmi.law.done .cost, .dmi.law.done .lv { color: var(--ink); }
.arow { background: var(--panel-2); padding: 8px 10px; display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 2px 12px; align-items: center; box-shadow: inset 3px 3px 0 0 #0b1026; }
.arow > div { min-width: 0; display: grid; gap: 1px; }
.arow strong { font-family: var(--font-pixel); font-weight: 600; font-size: 14px; }
.arow .up-d { font-size: 16px; }
.arow .rw { font-size: 16px; color: var(--green); }
.arow .st { font-family: var(--font-num); font-size: 18px; color: var(--yellow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arow .btn { height: 38px; font-size: 13px; }
.arow.fixed { background: var(--plum); box-shadow: none; }
.arow.fixed .rw { color: var(--ink); }
.arow.fixed .st { color: var(--peach); }
.endcv { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; background: #000; }
.endtxt { display: grid; gap: 10px; justify-items: center; text-align: center; margin-top: 14px; }
.endtxt > * { opacity: 0; animation: fadein 0.8s steps(4) forwards; }
.endtxt > :nth-child(1) { animation-delay: 1.2s; } .endtxt > :nth-child(2) { animation-delay: 2.6s; } .endtxt > :nth-child(3) { animation-delay: 4s; }
.endtxt > :nth-child(4) { animation-delay: 5.6s; } .endtxt > :nth-child(5) { animation-delay: 6.4s; } .endtxt > :nth-child(6) { animation-delay: 7s; }
.endtxt p { font-size: 22px; }
.endtxt h3 { font-family: var(--font-title); font-size: 17px; line-height: 1.5; color: var(--yellow); text-shadow: 3px 3px 0 var(--brown); }
.endtxt .sub { font-size: 18px; color: var(--muted); }
.endtxt .btn { width: min(280px, 100%); }
html.calm .endtxt > * { animation: none; opacity: 1; }
.run.crank { cursor: pointer; }
.run.crank:hover { box-shadow: inset 0 0 0 3px var(--blue); }
.run.crank:active canvas { transform: translateY(2px); }
.run.crank .autotag { background: var(--orange); }
details.panel summary { cursor: pointer; font-family: var(--font-title); font-size: 13px; color: var(--yellow); text-shadow: 2px 2px 0 var(--brown); }
.code { width: 100%; min-height: 80px; font-family: var(--font-term); font-size: 15px; background: var(--panel-2); color: var(--ink); border: 0; padding: 8px; margin-block: 8px; resize: vertical; box-shadow: inset 3px 3px 0 0 #0b1026; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }

.toasts { position: fixed; z-index: 30; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(380px, calc(100% - 38px)); display: grid; gap: 10px; pointer-events: none; }
@media (min-width: 860px) { .toasts { left: max(19px, calc((100vw - 1320px) / 2 + 3px)); transform: none; width: 340px; } }
.toast { font-size: 18px; background: var(--panel-2); padding: 7px 12px; box-shadow: 0 -3px 0 0 var(--blue), 0 3px 0 0 var(--blue), -3px 0 0 0 var(--blue), 3px 0 0 0 var(--blue), 6px 6px 0 0 rgba(0, 0, 0, 0.45); animation: fadein 0.25s steps(3); }
.toast.hot { box-shadow: 0 -3px 0 0 var(--orange), 0 3px 0 0 var(--orange), -3px 0 0 0 var(--orange), 3px 0 0 0 var(--orange), 6px 6px 0 0 rgba(0, 0, 0, 0.45); }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; image-rendering: pixelated; }

/* ---- Header buttons, windows, stats, settings ---- */
.ibtn { display: inline-flex; align-items: center; gap: 6px; width: auto; height: 32px; padding: 0 9px; font-size: 13px; color: var(--ink); }
.ibtn canvas { width: 24px; height: 24px; }
.ibtn:hover { box-shadow: inset 0 0 0 2px var(--yellow); }
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(5, 8, 20, 0.74); display: grid; place-items: center; padding: 22px 16px; }
.win { width: 100%; max-width: 660px; max-height: min(88vh, 860px); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.win:focus { outline: none; }
.winbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px 9px 14px; background: var(--panel-2); border-bottom: 3px solid var(--edge); }
.winbar h2 { font-family: var(--font-title); font-size: 14px; color: var(--yellow); text-shadow: 2px 2px 0 var(--brown); }

        c.fillRect((p.x + t * 2) | 0, p.y | 0, 1, 1);

function drawTrend() {
  const cv = $('trend'); if (!cv) return;
  const c = cv.getContext('2d'), w = cv.width, h = cv.height, data = S.trend.slice(-w);
  c.clearRect(0, 0, w, h);
  const q = f => $('winBody').querySelector(`[data-f="${f}"]`);
  if (!data.length) { setText(q('thi'), '—'); setText(q('tlo'), '—'); pen(c).rect(0, h - 1, w, 1, 'v'); return; }
  const logs = data.map(v => Math.log10(Math.max(v, 0.1)));
  const lo = Math.floor(Math.min(...logs)), hi = Math.max(lo + 1, Math.ceil(Math.max(...logs) + 0.001)), g = pen(c);
  for (let d = lo + 1; d < hi; d++) { const y = Math.round(h - 1 - (d - lo) / (hi - lo) * (h - 2)); for (let x = 0; x < w; x += 3) g.px(x, y, 's'); }
  data.forEach((v, i) => {
    const x = w - data.length + i, bh = Math.max(1, Math.round((logs[i] - lo) / (hi - lo) * (h - 2)));
    g.rect(x, h - bh, 1, bh, i === data.length - 1 ? 'y' : kOf(v) >= 1 ? 'P' : kOf(v) >= 0.5 ? 'G' : 'B');
  });
  g.rect(0, h - 1, w, 1, 'v');
  setText(q('thi'), W(Math.max(...data))); setText(q('tlo'), W(Math.min(...data)));
}

// ================= Cloud save (Google sign-in + Firestore) =================
// The module script at the bottom of the page connects Firebase when firebase-config.js is filled in.
// One document per player (saves/<uid>). The copy that's further along wins on open;
// a replaced local game is kept as a backup in this browser.
const CLOUD = { api: null, user: null, state: 'checking', busy: false, info: null, err: '', lastLife: -1, nudged: false, quotaWarned: false };
const BACKUP_KEY = SAVE_KEY + '-backup';
const DEVICE = (() => { try { let d = localStorage.getItem('hdh-device'); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem('hdh-device', d); } return d; } catch (e) { return Math.random().toString(36).slice(2, 10); } })();
let cloudChain = Promise.resolve();
const cloudTask = fn => (cloudChain = cloudChain.then(async () => { CLOUD.busy = true; try { await fn(); } catch (e) { cloudError(e); } finally { CLOUD.busy = false; } }));
function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 15) return 'just now';
  if (s < 60) return Math.floor(s) + ' s ago';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' days ago';
}
function aheadOf(a, b) { // is save a further along than save b?
  if (!b) return true;
  if (a.life > b.life * 1.000001 + 1) return true;
  if (a.life < b.life * 0.999999 - 1) return false;
  return a.t > b.t + 5;
}
function cloudError(e) {
  const code = (e && e.code) || '';
  if (code === 'permission-denied') CLOUD.err = 'The cloud refused this save. The site owner may need to publish the Firestore rules.';
  else if (code === 'resource-exhausted') {
    CLOUD.err = "The game's free cloud quota is used up for today. Your game still saves in this browser.";
    if (!CLOUD.quotaWarned) { CLOUD.quotaWarned = true; toast(CLOUD.err); }
  }
  else if (code === 'unauthenticated') CLOUD.err = 'Your sign-in expired. Sign in again to keep syncing.';
  else CLOUD.err = "Couldn't reach the cloud. It will try again in a couple of minutes.";
}
async function withRetry(fn) {
  try { return await fn(); }
  catch (e) { if (e && (e.code === 'unavailable' || e.code === 'deadline-exceeded')) { await new Promise(r => setTimeout(r, 800 + Math.random() * 1200)); return await fn(); } throw e; }
}
async function cloudPull() {
  if (CLOUD.state !== 'ready') return null;
  const d = await withRetry(() => CLOUD.api.get(CLOUD.user.uid));
  if (!d) { CLOUD.info = null; return null; }
  CLOUD.info = { at: d.savedAt, life: d.life, universe: d.universe };
  let s = null; try { s = hydrate(JSON.parse(d.data)); } catch (e) {}
  return s;
}
async function cloudPush() {
  if (CLOUD.state !== 'ready') return;
  S.saved = Date.now(); save();
  const body = { v: 1, data: JSON.stringify(S), savedAt: S.saved, device: DEVICE, life: S.life, universe: S.universe, t: S.t };
  await withRetry(() => CLOUD.api.set(CLOUD.user.uid, body));
  CLOUD.lastLife = S.life; CLOUD.err = '';
  CLOUD.info = { at: body.savedAt, life: body.life, universe: body.universe };
}
function keepBackup() { try { localStorage.setItem(BACKUP_KEY, JSON.stringify(S)); } catch (e) {} }
function hasBackup() { try { return !!localStorage.getItem(BACKUP_KEY); } catch (e) { return false; } }
function adopt(s, msg) {
  keepBackup();
  replaceGame(s);
  applyOffline(true);
  CLOUD.lastLife = S.life;
  toast(msg, true);
  say('Welcome back! I kept your universe warm.', true);
}
// Sign-in, opening the game, returning to the tab, or switching auto-sync on: take whichever copy is further along.
const cloudSync = () => cloudTask(async () => {
  if (CLOUD.state !== 'ready' || !S.ui.cloud) return;
  const remote = await cloudPull();
  if (remote && aheadOf(remote, S)) adopt(remote, 'Loaded your cloud save. It was further along than this device.');
  else if (!remote || aheadOf(S, remote)) await cloudPush();
});
const cloudAutosave = () => { if (CLOUD.state === 'ready' && S.ui.cloud && !CLOUD.busy && S.life !== CLOUD.lastLife) cloudTask(cloudPush); };
const cloudForcePush = () => { if (CLOUD.state === 'ready') cloudTask(cloudPush); };
function cloudAttach(api) {
  if (!api) { if (CLOUD.state === 'checking') CLOUD.state = 'off'; return; }
  if (CLOUD.api) return;
  CLOUD.api = api; CLOUD.state = 'signedout';
  api.onUser(u => {
    const before = CLOUD.user && CLOUD.user.uid;
    CLOUD.user = u; CLOUD.err = '';
    if (!u) { CLOUD.state = 'signedout'; CLOUD.info = null; return; }
    CLOUD.state = 'ready';
    if (u.uid !== before) { CLOUD.lastLife = -1; CLOUD.info = null; if (S.ui.cloud) cloudSync(); else cloudTask(cloudPull); }
  });
}
function cloudBoot() {
  window.addEventListener('hdh-cloud', e => cloudAttach(e.detail));
  if (window.HDH_CLOUD !== undefined) cloudAttach(window.HDH_CLOUD);
  setTimeout(() => { if (CLOUD.state === 'checking') CLOUD.state = 'off'; }, 15000);
  setTimeout(() => { if (CLOUD.state === 'signedout' && !CLOUD.nudged) { CLOUD.nudged = true; say('Psst. Sign in from Settings and I can keep your universe in the cloud.', true); } }, 25000);
}
function cloudSignIn() {
  if (!CLOUD.api) return;
  Promise.resolve(CLOUD.api.signIn()).then(() => toast('Signed in. Your game now syncs to the cloud.', true)).catch(e => {
    const c = (e && e.code) || '';
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
    toast(c === 'auth/popup-blocked' ? 'Your browser blocked the sign-in window. Allow pop-ups for this site, then try again.'
      : c === 'auth/unauthorized-domain' ? "Sign-in isn't enabled for this web address yet. The site owner needs to add it in Firebase."
      : c === 'auth/operation-not-allowed' ? "Google sign-in isn't switched on for this game yet."
      : "Sign-in didn't work. Please try again.");
  });
}
function cloudSignOut() {
  if (!CLOUD.api || CLOUD.state !== 'ready') return;
  cloudTask(cloudPush).then(() => CLOUD.api.signOut()).then(() => toast('Signed out. Your game keeps saving in this browser.')).catch(() => {});
}
function cloudStatus() {
  if (CLOUD.state === 'checking') return 'Connecting to the cloud…';
  if (CLOUD.state === 'off') return "Cloud save isn't set up on this copy of the game. Your game saves in this browser.";
  if (CLOUD.state === 'signedout') return 'Sign in with Google to back up your game and pick it up on any device. It also keeps saving in this browser.';
  if (CLOUD.busy) return 'Syncing with the cloud…';
  if (CLOUD.err) return CLOUD.err;
  if (!CLOUD.info) return S.ui.cloud ? 'Nothing in the cloud yet. Your first backup goes up in a moment.' : 'Nothing in the cloud yet. Turn on auto-sync or choose Save to cloud now.';
  return `Cloud copy: universe #${num(CLOUD.info.universe)}, ${J(CLOUD.info.life)} banked all-time, saved ${ago(CLOUD.info.at)}.`;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'run': if (!startRun(v)) crank(v); break;
    case 'buy': buySource(v); break;
    case 'buyamt': S.ui.buy = v === 'next' || v === 'max' ? v : +v; break;
    case 'up': buyUpgrade(v); break;
    case 'dm': buyDM(v); break;
    case 'open': openModal(v, el); return;
    case 'heat':
      if (qClaim() < 1) break;
      if (!heatArmed) { heatArmed = true; clearTimeout(heatTimer); heatTimer = setTimeout(() => { heatArmed = false; }, 4000); break; }
      heatArmed = false; say('Goodnight, universe. See you on the other side.', true);
      heatFx(() => { heatDeath(); recalc(); render(); cloudForcePush(); });
      break;
    case 'law': buyLaw(v); break;
    case 'anom': {
      if (!AI[v] || hasA(v) || !S.deaths) break;
      if (inA(v)) {
        if (!leaveArmed) { leaveArmed = true; disarmLater(); break; }
        leaveArmed = false; leaveAnomaly(); break;
      }
      if (anomArmed !== v) { anomArmed = v; disarmLater(); break; }
      anomArmed = ''; closeModal();
      crunchFx(() => { crunch(v); recalc(); render(); cloudForcePush(); });
      return;
    }
    case 'light': fundLight(); if (modal === 'end') return; break;
    case 'replay': openModal('end', el); return;
    case 'close': closeModal(); return;
    case 'set': setSetting(el.dataset.k, v); break;
    case 'crunch':
      if (S.ui.confirm && !crunchArmed) { crunchArmed = true; clearTimeout(crunchTimer); crunchTimer = setTimeout(() => { crunchArmed = false; }, 4000); }
      else { crunchArmed = false; say('See you on the other side of the Big Bang!', true); crunchFx(() => { crunch(); recalc(); render(); cloudForcePush(); }); }
      break;
    case 'copy': {
      const code = encodeSave(), ta = $('saveCode'); if (ta) ta.value = code;
      const fallback = () => { if (ta) { ta.focus(); ta.select(); } toast('Select the code in the box and copy it.'); };
      try { navigator.clipboard.writeText(code).then(() => toast('Save code copied.'), fallback); } catch (err) { fallback(); }
      break;
    }
    case 'csignin': cloudSignIn(); break;
    case 'csignout': cloudSignOut(); break;
    case 'cpush': cloudForcePush(); toast('Saving to the cloud…'); break;
    case 'cpull':
      if (!cpullArmed) { cpullArmed = true; disarmLater(); break; }
      cpullArmed = false;
      cloudTask(async () => { const r = await cloudPull(); if (r) adopt(r, 'Loaded your cloud save.'); else toast('There is no cloud save to load yet.'); });
      break;
    case 'crestore': {
      if (!crestArmed) { crestArmed = true; disarmLater(); break; }
      crestArmed = false;
      let b = null; try { b = hydrate(JSON.parse(localStorage.getItem(BACKUP_KEY))); } catch (err) {}
      if (!b) { toast('The backup could not be read.'); break; }
      try { localStorage.removeItem(BACKUP_KEY); } catch (err) {}
      replaceGame(b); cloudForcePush(); toast('Restored the game this device had before the cloud load.', true); return;
    }
    case 'import': {
      const ta = $('saveCode'), s = ta && ta.value.trim() ? decodeSave(ta.value) : null;
      if (!s) { toast('That save code could not be read. Paste the whole code and try again.'); importArmed = false; break; }
      if (!importArmed) { importArmed = true; disarmLater(); break; }
      importArmed = false; replaceGame(s); cloudForcePush(); toast('Save loaded.'); return;
    }
    case 'reset':
      if (!resetArmed) { resetArmed = true; disarmLater(); break; }
      resetArmed = false; closeModal(); replaceGame(fresh()); cloudForcePush(); toast('A brand new universe. Click the Hamster Wheel to begin.'); say('Welcome aboard! Click the wheel. I will do the running.', true); return;
  }
  recalc(); render();
});
document.addEventListener('input', e => { if (e.target.id === 'vol') { S.ui.vol = +e.target.value; } });
document.addEventListener('change', e => { if (e.target.id === 'vol' && S.ui.sound) tone([[660, 0.06], [880, 0.06]]); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) closeModal(); });
$('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// ================= Boot =================
function applyOffline(quiet) {
  recalc();
  const td = hasA('slow'), away = Math.min((Date.now() - S.saved) / 1000, td ? 259200 : 86400), earned = M.auto * away * (td ? 3 : 1);
  if (away > 60 && earned >= 1) {
    gain(earned); S.saved = Date.now();
    if (!quiet) { toast(`While you were away, your operators banked ${J(earned)}.`, true); say('While you were gone, the operators kept the lights on.', true); }
  }
}
let booted = false;
function start(data) {
  let s = null;
  if (data && typeof data.save === 'string') { try { s = hydrate(JSON.parse(data.save)); } catch (e) {} }
  const fromHot = !!s;
  S = s || loadLocal() || fresh();
  syncSets(); recalc();
  if (!booted) { buildSources(); resizeSky(); document.querySelectorAll('canvas[data-ui]').forEach(cv => UIICON[cv.dataset.ui](pen(cv.getContext('2d')))); }
  applySettings();
  if (!fromHot) applyOffline(false);
  if (S.life < 1) say('Welcome aboard! Click the wheel. I will do the running.', true);
  else if (!$('bubble').textContent) say(pick(quipPool()), true);
  sig = {};
  render();
  if (booted) return;
  booted = true;
  let last = performance.now(), frameN = 0;
  setInterval(() => {
    const now = performance.now(), dt = Math.min((now - last) / 1000, 3600);
    last = now; tick(dt); render(now);
    if (++frameN % 2 === 0) { drawMascotFrame(now); if (!calm() && S.ui.stars) drawSky(now); }
  }, 50);
  setInterval(save, 5000);
  setInterval(cloudAutosave, 120000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); cloudAutosave(); } else cloudSync(); });
  addEventListener('pagehide', () => { save(); cloudAutosave(); });
  cloudBoot();
  drawMascotFrame(performance.now());
  try { const l = document.createElement('link'); l.rel = 'icon'; l.href = $('mascot').toDataURL(); document.head.appendChild(l); } catch (e) {}
}
start({});
</script>
<script src="firebase-config.js"></script>
<script type="module">
// Connects Google sign-in and Firestore when firebase-config.js is filled in. Without it the game saves in the browser only.
const cfg = window.FIREBASE_CONFIG;
const announce = api => { window.HDH_CLOUD = api; window.dispatchEvent(new CustomEvent('hdh-cloud', { detail: api })); };
if (!cfg || !cfg.apiKey || !cfg.projectId) announce(null);
else {
  try {
    const SDK = 'https://www.gstatic.com/firebasejs/12.19.0/';
    const [{ initializeApp }, A, F] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]);
    const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
    const provider = new A.GoogleAuthProvider();
    announce({
      onUser: cb => A.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, name: u.displayName || '', email: u.email || '' } : null)),
      signIn: () => A.signInWithPopup(auth, provider),
      signOut: () => A.signOut(auth),
      get: async uid => { const snap = await F.getDoc(F.doc(db, 'saves', uid)); return snap.exists() ? snap.data() : null; },
      set: (uid, body) => F.setDoc(F.doc(db, 'saves', uid), body)
    });
  } catch (e) { console.warn('Cloud save could not start:', e); announce(null); }
}
</script>
